# ===========================================================================
# Coolify 部署 (默认): 使用 GHCR 预编译镜像 —— 弱性能节点零编译, 直接拉取运行.
# 在 Coolify 资源里选 "Docker Compose", 指向本仓库, 然后到 Environment Variables
# 面板填写下面用到的变量 (API_HOST / API_KEY / NODE_ID / NODE_TYPE ...).
# ===========================================================================
services:
  nanako-node:
    image: ghcr.io/nnkcdn/nnknode:latest
    pull_policy: always           # 公开镜像, 每次部署拉最新 (镜像更新即生效)
    container_name: nanako-node
    restart: unless-stopped

    # 代理节点: host 网络最省心 (任意端口 + Hysteria2/TUIC 的 UDP 直通)
    network_mode: host

    environment:
      # ── 必填 ──
      API_HOST: ${API_HOST}                      # 面板地址
      API_KEY: ${API_KEY}                        # 节点通信密钥
      NODE_ID: ${NODE_ID}                        # 节点ID (数字)
      NODE_TYPE: ${NODE_TYPE}                    # vmess/vless/trojan/shadowsocks/hysteria2/tuic
      # ── 可选 (有默认值) ──
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CORE_TYPE: ${CORE_TYPE:-xray}              # xray / sing / hysteria2
      CERT_MODE: ${CERT_MODE:-none}              # none/file/dns/http
      # ── 以下变量按需在 Coolify 面板手动添加, 不在此固定 ──
      # CERT_DOMAIN / CERT_PROVIDER / CERT_EMAIL  → 需要 TLS 证书时添加
      # DNSENV_CF_DNS_API_TOKEN                   → DNS-01 签发时添加
      # DNS_SERVERS                               → 自定义 DNS 时添加
      # HEALTHCHECK_PORT                          → 端口健康检查时添加

    volumes:
      - cert-data:/etc/nanako-node/cert          # 自动签发的证书持久化

    # 镜像已自带 HEALTHCHECK; 这里显式声明便于 Coolify 读取/覆盖
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck.sh"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  cert-data:
