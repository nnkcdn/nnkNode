# ===========================================================================
# Coolify 部署 (可选): 在节点本机从源码构建 —— 仅用于性能足够的机器.
# 弱节点请用默认的 docker-compose.yml (预编译镜像).
# Coolify 资源选 "Docker Compose" 并指定本文件, 或直接用 Dockerfile 构建包.
# ===========================================================================
services:
  nanako-node:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: nanako-local
        # 内存小的机器可精简构建标签提速/降内存:
        # BUILD_TAGS: "sing xray hysteria2 with_quic with_grpc with_utls with_acme"
    image: nanako-node:local
    container_name: nanako-node
    restart: unless-stopped
    network_mode: host

    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CORE_TYPE: ${CORE_TYPE:-xray}
      API_HOST: ${API_HOST}
      API_KEY: ${API_KEY}
      NODE_ID: ${NODE_ID}
      NODE_TYPE: ${NODE_TYPE}
      API_TIMEOUT: ${API_TIMEOUT:-30}
      LISTEN_IP: ${LISTEN_IP:-0.0.0.0}
      SEND_IP: ${SEND_IP:-0.0.0.0}
      DEVICE_ONLINE_MIN_TRAFFIC: ${DEVICE_ONLINE_MIN_TRAFFIC:-100}
      CERT_MODE: ${CERT_MODE:-none}
      CERT_DOMAIN: ${CERT_DOMAIN:-}
      CERT_PROVIDER: ${CERT_PROVIDER:-}
      CERT_EMAIL: ${CERT_EMAIL:-}
      DNSENV_CF_DNS_API_TOKEN: ${DNSENV_CF_DNS_API_TOKEN:-}
      HEALTHCHECK_PORT: ${HEALTHCHECK_PORT:-}

    volumes:
      - cert-data:/etc/nanako-node/cert

    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck.sh"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  cert-data:
